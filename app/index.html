<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCE · Gestão</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FCE">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>:root{
  --navy:#0E1A2B;--navy-2:#16263d;--gold:#C9901C;--gold-2:#e0a93a;--gold-soft:rgba(201,144,28,.12);
  --bg:#F4F2ED;--surface:#FFFFFF;--surface-2:#F9F8F5;--line:rgba(14,26,43,.09);--line-2:rgba(14,26,43,.16);
  --txt:#142033;--mut:#667085;--mut-2:#98A2B3;
  --ok:#12805c;--ok-soft:rgba(18,128,92,.12);--warn:#b54708;--warn-soft:rgba(181,71,8,.12);--bad:#c0261a;--bad-soft:rgba(192,38,26,.11);--info:#2e6ad1;--info-soft:rgba(46,106,209,.11);
  --r:14px;--r-sm:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sh-lg:0 12px 32px rgba(16,24,40,.14);
  --side:248px;--top:60px;--tab:68px;
  --serif:"Playfair Display",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --bg:#0A111D;--surface:#111B2B;--surface-2:#0E1726;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --txt:#E8EBF0;--mut:#98A2B3;--mut-2:#6b7688;--gold-soft:rgba(224,169,58,.14);
  --ok-soft:rgba(18,160,112,.16);--warn-soft:rgba(230,120,40,.16);--bad-soft:rgba(230,70,60,.16);--info-soft:rgba(80,140,240,.16);
  --sh:0 1px 2px rgba(0,0,0,.4);--sh-lg:0 12px 32px rgba(0,0,0,.5)}}
:root[data-tema="escuro"]{--bg:#0A111D;--surface:#111B2B;--surface-2:#0E1726;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --txt:#E8EBF0;--mut:#98A2B3;--mut-2:#6b7688;--gold-soft:rgba(224,169,58,.14);--ok-soft:rgba(18,160,112,.16);--warn-soft:rgba(230,120,40,.16);--bad-soft:rgba(230,70,60,.16);--info-soft:rgba(80,140,240,.16);--sh:0 1px 2px rgba(0,0,0,.4);--sh-lg:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
/* layout */
.app{min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#DDE3EC;display:flex;flex-direction:column;padding:18px 14px;z-index:30}
.marca{display:flex;align-items:center;gap:12px;padding:6px 8px 22px}
.marca .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#1c2e49,#0b1524);border:1px solid rgba(201,144,28,.45);display:grid;place-items:center;font:700 22px var(--serif);color:var(--gold)}
.marca b{display:block;font:700 17px/1.1 var(--serif);color:#fff;letter-spacing:.2px}
.marca span{font-size:12px;color:#8C98AB;letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#B7C1D0;font-weight:500;position:relative}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(201,144,28,.14);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .bdg{margin-left:auto}
.side .rodape{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.08)}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.side .rodape .n{font-size:13px;color:#fff;font-weight:600;line-height:1.2}
.side .rodape .e{font-size:11.5px;color:#8C98AB;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.side .rodape button{margin-left:auto;background:none;border:0;color:#8C98AB;cursor:pointer;padding:6px;border-radius:8px}
.side .rodape button:hover{color:#fff;background:rgba(255,255,255,.06)}
.main{margin-left:var(--side);min-height:100vh}
.topo{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent}
.topo.sombra{border-bottom-color:var(--line)}
.topo h1{font:700 21px var(--serif);margin:0;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .acoes{margin-left:auto;display:flex;gap:8px;align-items:center}
.conteudo{padding:8px 28px 48px;max-width:1240px}
.tabbar{display:none}
@media (max-width:900px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
  .topo{padding:0 16px;padding-top:env(safe-area-inset-top);height:calc(var(--top) + env(safe-area-inset-top))}
  .topo h1{font-size:19px}
  .conteudo{padding:6px 16px 32px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab) + env(safe-area-inset-bottom));padding:6px 6px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mut);position:relative;border-radius:12px}
  .tabbar a.on{color:var(--gold)}
  .tabbar a .bdg{position:absolute;top:2px;left:calc(50% + 6px)}
  .tabbar svg.i{width:23px;height:23px}
}
/* elementos */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media (min-width:1260px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.card>.cab{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.card>.cab h2{font-size:14.5px;font-weight:650;margin:0;letter-spacing:.1px}
.card>.cab .dir{margin-left:auto;display:flex;gap:6px;align-items:center}
.card>.corpo{padding:12px 16px 16px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .rot{font-size:12.5px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font:700 25px/1.1 var(--sans);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--mut)}
.kpi .ico{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
@media (max-width:760px){.kpi .val{font-size:21px}.kpi{padding:12px 13px}.kpi .ico{display:none}}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--mut);border:1px solid var(--line)}
.chip.ouro{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.nav{background:var(--navy);color:#fff;border-color:transparent}
.bdg{min-width:19px;height:19px;padding:0 6px;border-radius:99px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.bdg.r{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--mut-2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.pri:hover{background:var(--gold-2)}
.btn.esc{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.fant{border-color:transparent;background:transparent;color:var(--mut)}
.btn.fant:hover{background:var(--surface-2);color:var(--txt)}
.btn.perigo{color:var(--bad)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.ico{width:38px;padding:0}
.btn[disabled]{opacity:.55;pointer-events:none}
.mut{color:var(--mut)}.pq{font-size:13px}.pp{font-size:12px}
.lista{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);cursor:default}
.item:first-child{border-top:0}
a.item,.item.clic{cursor:pointer}
a.item:hover,.item.clic:hover{background:var(--surface-2)}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px;line-height:1.35}
.item .d{font-size:13px;color:var(--mut);line-height:1.4;margin-top:2px}
.item .dir{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:var(--mut-2)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.ouro{background:var(--gold)}.dot.info{background:var(--info)}
.ic-circ{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--mut)}
.ic-circ.bad{background:var(--bad-soft);color:var(--bad)}.ic-circ.warn{background:var(--warn-soft);color:var(--warn)}.ic-circ.ok{background:var(--ok-soft);color:var(--ok)}.ic-circ.ouro{background:var(--gold-soft);color:var(--gold)}.ic-circ.info{background:var(--info-soft);color:var(--info)}
.vazio{padding:28px 16px;text-align:center;color:var(--mut);font-size:14px}
.vazio svg.i{width:30px;height:30px;color:var(--mut-2);margin-bottom:6px}
.sec-tit{font:700 13px var(--sans);text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:26px 2px 10px;display:flex;align-items:center;gap:8px}
.ola{margin:14px 0 18px}
.ola h2{font:700 26px var(--serif);margin:0;letter-spacing:.1px}
.ola p{margin:4px 0 0;color:var(--mut)}
@media (max-width:760px){.ola h2{font-size:22px}}
/* busca e filtros */
.busca{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line-2);flex:1;min-width:0}
.busca input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:12px 0}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:none;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.filtros button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filtros button .n{opacity:.7;margin-left:4px;font-weight:500}
select.sel,input.inp,textarea.inp{height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;outline:0;width:100%}
textarea.inp{height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.45}
select.sel:focus,input.inp:focus,textarea.inp:focus,.busca:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
/* caso */
.cab-caso{padding:18px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cab-caso .av{width:56px;height:56px;font-size:19px}
.cab-caso h2{font:700 23px/1.2 var(--serif);margin:0}
.cab-caso .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cab-caso .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
@media (max-width:760px){.cab-caso .acoes{margin-left:0;width:100%}.cab-caso .acoes .btn{flex:1}}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin:16px 0 14px;position:sticky;top:var(--top);background:var(--bg);z-index:10}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;border:0;background:none;padding:11px 12px;font-weight:600;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.abas button.on{color:var(--txt);border-bottom-color:var(--gold)}
@media (max-width:900px){.abas{top:calc(var(--top) + env(safe-area-inset-top))}}
.def{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 16px;font-size:14px}
.def dt{color:var(--mut)}.def dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.def{grid-template-columns:1fr}.def dt{margin-top:6px}}
.texto{white-space:pre-wrap;font-size:14.5px;line-height:1.6}
.gauge{display:flex;align-items:center;gap:12px}
.gauge .barra{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.gauge .barra i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.gauge b{font:700 22px var(--sans)}
ul.lim{margin:6px 0 0;padding-left:18px}ul.lim li{margin:3px 0}
/* conversa */
.chat{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line);max-height:70vh;overflow:auto}
.bolha{max-width:78%;padding:8px 12px 6px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--sh)}
.bolha.in{align-self:flex-start;background:var(--surface);border-top-left-radius:4px}
.bolha.out{align-self:flex-end;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border-top-right-radius:4px}
.bolha .h{display:block;text-align:right;font-size:11px;color:var(--mut);margin-top:2px}
.bolha .doc{display:flex;gap:6px;align-items:center;font-weight:600}
.dia-sep{align-self:center;font-size:11.5px;font-weight:600;color:var(--mut);background:var(--surface);border:1px solid var(--line);padding:2px 10px;border-radius:99px;margin:8px 0}
/* aprovações */
.prev{border-radius:12px;overflow:hidden;background:#0E1A2B;position:relative}
.prev iframe{border:0;transform-origin:0 0;display:block;pointer-events:none;position:absolute;top:0;left:0}
.ad-post{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:16px;padding:16px}
@media (max-width:760px){.ad-post{grid-template-columns:1fr}}
.ad-post .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:var(--sh)}
/* agenda */
.dia-ag{margin-top:18px}
.dia-ag h3{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.dia-ag h3 .hoje{color:var(--gold)}
.hora{font:600 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--mut);width:48px;flex:none;padding-top:1px}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mes .cab{font-size:11.5px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0;text-transform:uppercase}
.mes .dia{min-height:78px;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:6px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mes .dia.fora{opacity:.4}
.mes .dia.hoje{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.mes .dia .n{font-weight:700;font-size:12.5px}
.mes .dia .ev{font-size:10.5px;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
@media (max-width:760px){.mes .dia{min-height:54px}.mes .dia .ev{display:none}.mes .dia .pts{display:flex;gap:3px}}
.mes .dia .pts{display:none}
.mes .dia .pts i{width:6px;height:6px;border-radius:50%}
.t-consulta{background:var(--info-soft);color:var(--info)}.t-prazo{background:var(--bad-soft);color:var(--bad)}.t-leilao{background:var(--warn-soft);color:var(--warn)}.t-post{background:var(--gold-soft);color:var(--gold)}
/* tabelas e gráficos */
.tab-wrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.tb th{text-align:right;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb tr:last-child td{border-bottom:0}
table.tb tfoot td{font-weight:700;border-top:1px solid var(--line-2)}
.barras{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.barras .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.barras .b i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:var(--gold);min-height:2px}
.barras .b i.s{background:var(--navy)}
:root[data-tema="escuro"] .barras .b i.s{background:#5b6f8f}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]) .barras .b i.s{background:#5b6f8f}}
.barras .b span{font-size:10.5px;color:var(--mut);white-space:nowrap}
.barras .par{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:100%}
.barras .par i{max-width:18px}
.funil .l{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
.funil .l .nm{width:150px;flex:none;color:var(--mut)}
.funil .l .br{flex:1;height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.funil .l .br i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),#2a4165);border-radius:6px}
.funil .l b{width:30px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.funil .l .nm{width:112px;font-size:12.5px}}
.prog{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok)}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* modal, toast, carregando */
.veu{position:fixed;inset:0;background:rgba(8,14,24,.5);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:sobe .18s}
.modal .mh{padding:18px 20px 6px;display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font:700 19px var(--serif)}
.modal .mb{padding:8px 20px 4px}
.modal .mf{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:560px){.veu{align-items:flex-end;padding:0}.modal{border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom)}.modal .mf .btn{flex:1}}
@keyframes fade{from{opacity:0}}@keyframes sobe{from{transform:translateY(14px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh-lg);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;animation:sobe .2s;max-width:calc(100% - 32px)}
.toast.erro{background:var(--bad)}
@media (max-width:900px){.toast{bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom))}}
.esq{background:linear-gradient(90deg,var(--surface-2) 25%,color-mix(in srgb,var(--surface-2) 40%,var(--line)) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:brilho 1.2s infinite;border-radius:10px}
@keyframes brilho{to{background-position:-200% 0}}
.gira{animation:gira .8s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,rgba(201,144,28,.22),transparent 60%),radial-gradient(900px 500px at 110% 110%,rgba(46,72,110,.55),transparent 60%),var(--navy)}
.login .caixa{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:34px 28px;text-align:center;color:#DDE3EC;backdrop-filter:blur(8px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;background:linear-gradient(135deg,#1c2e49,#0b1524);border:1px solid rgba(201,144,28,.5);display:grid;place-items:center;font:700 34px var(--serif);color:var(--gold)}
.login h1{font:700 28px var(--serif);color:#fff;margin:0}
.login p{color:#9AA6B8;margin:6px 0 26px;font-size:14px}
.login .gbtn{display:flex;justify-content:center;min-height:44px}
.login .obs{font-size:12px;color:#7C889B;margin-top:22px}
.login .erro{background:rgba(192,38,26,.18);color:#ffb4ab;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:16px}
.pull{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.so-desk{}@media (max-width:760px){.so-desk{display:none}}
tr.clic{cursor:pointer}tr.clic:hover td{background:var(--surface-2)}
.item.clic{cursor:pointer}
.pag-nav{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(8,14,24,.72);color:#fff;border-radius:99px;padding:4px 6px;font-size:12px;font-weight:600;backdrop-filter:blur(4px)}
.pag-nav button{border:0;background:rgba(255,255,255,.14);color:#fff;width:26px;height:26px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer}
/* logotipo */
.marca{flex-direction:column;align-items:flex-start;gap:8px;padding:8px 10px 24px}
.marca .lg{width:188px;height:auto;display:block}
.marca span{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:#8C98AB}
.topo-marca{display:none}
.lm{height:17px;width:auto;display:block;color:var(--txt)}
.lg-login{width:250px;max-width:80%;height:auto;display:block;margin:4px auto 14px}
/* rodapé institucional fixo */
.rod{position:fixed;left:var(--side);right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);font-size:11.5px;line-height:1.45;color:var(--mut)}
.rod-lin{display:none}
.rod-det{display:flex;gap:36px;padding:9px 28px 10px;flex-wrap:wrap}
.rb{display:flex;flex-direction:column;min-width:0}
.rb b{color:var(--txt);font-size:11.5px;font-weight:700}
.rb a{color:inherit;text-decoration:none}.rb a:hover{color:var(--gold)}
.main{padding-bottom:84px}
@media (max-width:900px){
  .topo-marca{display:flex;align-items:center;padding-right:10px;margin-right:2px;border-right:1px solid var(--line-2);height:22px}
  .rod{left:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));font-size:11.5px}
  .rod-lin{display:flex;align-items:center;width:100%;border:0;background:none;color:var(--mut);font:inherit;padding:7px 16px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden}
  .rod-lin b{color:var(--txt)}
  .rod-lin span{overflow:hidden;text-overflow:ellipsis}
  .rod-seta{margin-left:auto;font-style:normal;font-size:16px;line-height:1;transform:rotate(-90deg);transition:transform .2s;padding-left:8px}
  .rod.aberto .rod-seta{transform:rotate(90deg)}
  .rod-det{display:none;flex-direction:column;gap:10px;padding:2px 16px 12px}
  .rod.aberto .rod-det{display:flex}
  .main{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 40px)}
}
.rod-login{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;text-align:center;margin-top:26px;font-size:11.5px;line-height:1.5;color:#8C98AB;max-width:720px}
.rod-login .rb b{color:#DDE3EC}
.rod-login .rb{align-items:center}
.login{grid-template-rows:1fr auto;align-content:center}
@media print{.rod{display:none}}

.rod-mais{display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--mut)}.rod-mais .rb b{font-size:13px}
[data-bdg][hidden]{display:none!important}

// Cache em duas camadas: memória (45 s) e aparelho (localStorage). Ao abrir, mostra o último dado na hora
// e busca o novo em segundo plano; se mudou, a tela se redesenha sozinha.
const LSK = 'fce_c_';
function lerLS(k) { try { const v = localStorage.getItem(LSK + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function gravar(k, d) { S.cache[k] = { d, t: Date.now() }; try { localStorage.setItem(LSK + k, JSON.stringify({ d, t: Date.now() })); } catch (e) { limparLS(); } }

S.rev = {};
function revalidar(k, acao, extra) {
  if (S.rev[k]) return; S.rev[k] = 1;
  const hash = location.hash, antes = JSON.stringify((S.cache[k] || {}).d);
  api(acao, extra).then((d) => {
    gravar(k, d);
    if (JSON.stringify(d) !== antes && location.hash === hash && !$('.veu') && !(document.activeElement && /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName))) rota();
  }).catch(() => {}).finally(() => { delete S.rev[k]; });
}
async function dados(chave, acao, extra, forcar) {
  const mem = S.cache[chave];
  if (!forcar && mem && Date.now() - mem.t < 45000) return mem.d;
  if (!forcar) {
    const velho = mem || lerLS(chave);
    if (velho) { if (!mem) S.cache[chave] = { d: velho.d, t: 0 }; revalidar(chave, acao, extra); return velho.d; }
  }
  const d = await api(acao, extra); gravar(chave, d); return d;
}

  titulo('Agenda', '<div class="seg" data-seg-own id="modoAg"><button data-m="lista" class="' + (S.modoAg === 'lista' ? 'on' : '') + '">Lista</button><button data-m="mes" class="' + (S.modoAg === 'mes' ? 'on' : '') + '">Mês</button></div>');
  if (!S.cache.agenda) carregando(4);
  const ev = (await dados('agenda', 'agenda', null, forcar)).map((e) => Object.assign({}, e, { titulo: e.tipo === 'prazo' ? trataPrazoTit(e.titulo) : e.titulo }));
  $$('#modoAg button').forEach((b) => b.onclick = () => { S.modoAg = b.dataset.m; VIEWS.agenda(); });
  const leg = '<div class="legenda" style="flex-wrap:wrap;margin:12px 2px 0">' + Object.entries(TIPO_AG).map(([k, v]) => '<span><i class="t-' + (k === 'leilao' ? 'leilao' : k) + '"></i>' + v[0] + '</span>').join('') + '</div>';
  const linha = (e) => {
    const [n, i, c] = TIPO_AG[e.tipo] || ['', 'cal', ''];
    const pass = new Date(e.quando) < new Date();
    return '<div class="item' + (e.caso_id ? ' clic" data-href="#/caso/' + e.caso_id : '') + '" style="' + (pass ? 'opacity:.6' : '') + '"><div class="hora" style="width:48px;font-weight:700;font-variant-numeric:tabular-nums">' + esc(hora(e.quando)) + '</div><div class="ic-circ ' + c + '">' + ic(i, 's') + '</div><div class="mid"><div class="t">' + esc(e.titulo) + '</div><div class="d">' + esc(n) + (e.status ? ' · ' + esc(String(e.status).toLowerCase()) : '') + (e.tipo === 'prazo' ? ' · ' + esc(faltam(e.quando).t) : '') + '</div></div>' +
      (e.link && e.status === 'CONFIRMADO' ? '<a class="btn sm pri" href="' + esc(e.link) + '" target="_blank" rel="noopener">' + ic('video', 's') + ' Meet</a>' : '') + '</div>';
  };
  let h = leg;
  if (S.modoAg === 'lista') {
    const fut = ev.filter((e) => new Date(e.quando) > Date.now() - 864e5);
    if (!fut.length) h += '<div class="card" style="margin-top:14px"><div class="vazio">' + ic('cal') + '<div>Nada marcado nos próximos 60 dias.</div></div></div>';
    const grupos = {}; fut.forEach((e) => { (grupos[diaChave(e.quando)] = grupos[diaChave(e.quando)] || []).push(e); });
    Object.keys(grupos).sort().forEach((k) => {
      const hoje = k === hojeChave();
      h += '<div class="dia-ag"><h3><span class="' + (hoje ? 'hoje' : '') + '">' + (hoje ? 'Hoje · ' : '') + esc(fmtD(grupos[k][0].quando, { weekday: 'long', day: 'numeric', month: 'long' })) + '</span></h3><div class="card lista">' + grupos[k].map(linha).join('') + '</div></div>';
    });
  } else {
    S.mesAg = S.mesAg || hojeChave().slice(0, 7);
    const [a, m] = S.mesAg.split('-').map(Number);
    const ini = new Date(Date.UTC(a, m - 1, 1, 12)), dow = (ini.getUTCDay() + 6) % 7;
    const porDia = {}; ev.forEach((e) => { (porDia[diaChave(e.quando)] = porDia[diaChave(e.quando)] || []).push(e); });
    h += '<div class="card" style="margin-top:12px"><div class="cab"><button class="btn fant ico sm" data-mm="-1">' + ic('voltar', 's') + '</button><h2 style="flex:1;text-align:center;text-transform:capitalize">' + esc(ini.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric', timeZone: 'UTC' })) + '</h2><button class="btn fant ico sm" data-mm="1">' + ic('seta', 's') + '</button></div><div class="corpo"><div class="mes">' +
      ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map((x) => '<div class="cab">' + x + '</div>').join('');
    for (let i = 0; i < 42; i++) {
      const dt = new Date(ini.getTime() + (i - dow) * 864e5), k = dt.toISOString().slice(0, 10), es = porDia[k] || [];
      if (i >= 35 && dt.getUTCMonth() !== m - 1) break;
      h += '<div class="dia' + (dt.getUTCMonth() !== m - 1 ? ' fora' : '') + (k === hojeChave() ? ' hoje' : '') + '" data-dia="' + k + '"><span class="n">' + dt.getUTCDate() + '</span>' + es.slice(0, 3).map((e) => '<span class="ev t-' + e.tipo + '">' + esc(hora(e.quando) + ' ' + e.titulo) + '</span>').join('') + (es.length > 3 ? '<span class="pp mut">+' + (es.length - 3) + '</span>' : '') +
        '<span class="pts">' + es.slice(0, 4).map((e) => '<i class="t-' + e.tipo + '" style="background:currentColor"></i>').join('') + '</span></div>';
    }
    h += '</div></div></div><div id="diaSel"></div>';
  }
  $('#cont').innerHTML = h;
  const ligar = () => $$('[data-href]').forEach((el) => el.onclick = (e) => { if (!e.target.closest('a')) location.hash = el.dataset.href; });
  $$('[data-mm]').forEach((b) => b.onclick = () => { const d = new Date(Date.UTC(a0(), m0() - 1 + +b.dataset.mm, 1)); S.mesAg = d.toISOString().slice(0, 7); VIEWS.agenda(); });
  function a0() { return +S.mesAg.slice(0, 4); } function m0() { return +S.mesAg.slice(5, 7); }
  $$('[data-dia]').forEach((el) => el.onclick = () => {
    $$('[data-dia]').forEach((x) => x.style.outline = ''); el.style.outline = '2px solid var(--gold)';
    const es = ev.filter((e) => diaChave(e.quando) === el.dataset.dia);
    $('#diaSel').innerHTML = '<div class="dia-ag"><h3>' + esc(fmtD(el.dataset.dia + 'T12:00:00', { weekday: 'long', day: 'numeric', month: 'long' })) + '</h3><div class="card lista">' + (es.length ? es.map(linha).join('') : '<div class="vazio" style="padding:18px">Nada neste dia.</div>') + '</div></div>';
    ligar();
  });
  ligar();
  if (S.modoAg === 'mes') { const hj = $('[data-dia="' + hojeChave() + '"]'); if (hj) hj.click(); }
};

VIEWS.financeiro = async (_, forcar) => {
  titulo('Financeiro', '<a class="btn sm pri" href="' + LINKS.proposta + '" target="_blank" rel="noopener">' + ic('caneta', 's') + '<span class="so-desk"> Registrar proposta</span></a>');
  if (!S.cache.fin) carregando(4);
  const d = await dados('fin', 'financeiro', null, forcar);
  const m = d.mes || {}, ms = d.meses || [], pr = d.propostas || [], ho = d.honorarios || [], co = d.consultas || [];
  const kpi = (rot, val, sub, i) => '<div class="card kpi"><div class="ico">' + ic(i, 's') + '</div><div class="rot">' + rot + '</div><div class="val">' + val + '</div><div class="sub">' + sub + '</div></div>';
  const aReceber = ho.filter((x) => x.status !== 'PAGA').reduce((s, x) => s + Number(x.valor || 0) * (x.parcelas ? (x.parcelas - x.pagas) / x.parcelas : 1), 0);
  let h = '<div class="kpis" style="margin-top:12px">' + kpi('Recebido no mês', brlc(m.recebido), 'líquido das taxas', 'din') + kpi('Contratado no mês', brlc(m.contratado), 'honorários assinados', 'caneta') +
    kpi('Consultas pagas', num(m.consultas), 'neste mês', 'video') + kpi('A receber', brlc(aReceber), 'parcelas em aberto', 'relogio') + kpi('Investido em anúncios', brlc(m.gasto_ads), 'Google + Meta no mês', 'mega') +
    kpi('Retorno', Number(m.gasto_ads) > 0 ? (Number(m.contratado) / Number(m.gasto_ads)).toFixed(1).replace('.', ',') + 'x' : '—', 'contratado ÷ anúncios', 'grafico') + '</div>';
  const mx = Math.max(1, ...ms.map((x) => Math.max(Number(x.recebido), Number(x.contratado))));
  h += '<div class="grid g2" style="margin-top:16px"><div class="card"><div class="cab"><h2>Últimos 6 meses</h2></div><div class="corpo"><div class="barras" style="height:150px">' +
    ms.map((x) => '<div class="b" title="' + x.mes + ' · recebido ' + brl(x.recebido) + ' · contratado ' + brl(x.contratado) + '"><div class="par"><i style="height:' + (100 * x.recebido / mx) + '%"></i><i class="s" style="height:' + (100 * x.contratado / mx) + '%"></i></div><span>' + x.mes + '</span></div>').join('') +
    '</div><div class="legenda"><span><i style="background:var(--gold)"></i>Recebido</span><span><i style="background:var(--navy)"></i>Contratado</span></div></div></div>';
  const ass = pr.filter((p) => p.status === 'ASSINADO_CLIENTE');
  const and = pr.filter((p) => ['AGUARDANDO_DADOS', 'DADOS_RECEBIDOS', 'CONTRATO_ENVIADO'].includes(p.status));
  h += '<div class="card"><div class="cab"><h2>Contratos em andamento</h2></div><div class="lista" style="margin-top:8px">';
  if (!ass.length && !and.length) h += '<div class="vazio">' + ic('caneta') + '<div>Nenhum contrato pendente.</div></div>';
  ass.forEach((p) => { h += '<div class="item"><div class="ic-circ warn">' + ic('caneta', 's') + '</div><div class="mid"><div class="t">' + esc(p.nome) + ' · ' + brl(p.valor_total) + '</div><div class="d">O cliente já assinou, falta a sua assinatura</div></div>' + (p.zapsign_url_fabio ? '<a class="btn sm pri" href="' + esc(p.zapsign_url_fabio) + '" target="_blank" rel="noopener">Assinar</a>' : '') + '</div>'; });
  and.forEach((p) => { h += '<a class="item" href="#/caso/' + p.caso_id + '"><div class="ic-circ">' + ic('relogio', 's') + '</div><div class="mid"><div class="t">' + esc(p.nome) + ' · ' + brl(p.valor_total) + '</div><div class="d">' + esc(STATUS_PROP[p.status] || p.status) + ' · ' + esc(quando(p.updated_at, true)) + '</div></div>' + ic('seta', 's') + '</a>'; });
  h += '</div></div></div>';
  h += '<div class="sec-tit">Honorários</div><div class="card tab-wrap"><table class="tb"><thead><tr><th>Cliente</th><th>Valor</th><th>Parcelas</th><th>Situação</th></tr></thead><tbody>' +
    (ho.length ? ho.map((x) => '<tr class="clic" data-href="#/caso/' + x.caso_id + '"><td>' + esc(x.nome) + '</td><td>' + brl(x.valor) + '</td><td>' + (x.parcelas ? x.pagas + '/' + x.parcelas : '—') + '</td><td><span class="chip ' + (x.status === 'PAGA' ? 'ok' : 'warn') + '">' + esc(String(x.status).toLowerCase()) + '</span></td></tr>').join('') : '<tr><td colspan="4" class="mut" style="text-align:center">Nenhum honorário cobrado ainda.</td></tr>') + '</tbody></table></div>';
  h += '<div class="sec-tit">Consultas</div><div class="card tab-wrap"><table class="tb"><thead><tr><th>Cliente</th><th>Valor</th><th>Enviada</th><th>Paga</th></tr></thead><tbody>' +
    (co.length ? co.map((x) => '<tr class="clic" data-href="#/caso/' + x.caso_id + '"><td>' + esc(x.nome) + '</td><td>' + brl(x.valor) + '</td><td>' + esc(x.enviada_em ? dataCurta(x.enviada_em) : '—') + '</td><td>' + (x.pago_em ? '<span class="chip ok">' + esc(dataCurta(x.pago_em)) + '</span>' : '<span class="chip warn">' + esc(String(x.status).toLowerCase()) + '</span>') + '</td></tr>').join('') : '<tr><td colspan="4" class="mut" style="text-align:center">Nenhuma consulta cobrada ainda.</td></tr>') + '</tbody></table></div>';
  const outras = pr.filter((p) => ['ASSINADO', 'COBRANCA_ENVIADA', 'FALHOU'].includes(p.status));
  if (outras.length) h += '<div class="sec-tit">Contratos fechados</div><div class="card lista">' + outras.map((p) => '<a class="item" href="#/caso/' + p.caso_id + '"><div class="ic-circ ok">' + ic('check', 's') + '</div><div class="mid"><div class="t">' + esc(p.nome) + ' · ' + brl(p.valor_total) + (p.parcelas > 1 ? ' em ' + p.parcelas + 'x' : '') + '</div><div class="d">' + esc(STATUS_PROP[p.status] || p.status) + ' · ' + esc(quando(p.updated_at, true)) + '</div></div></a>').join('') + '</div>';
  $('#cont').innerHTML = h;
  $$('[data-href]').forEach((el) => el.onclick = () => location.hash = el.dataset.href);
};

VIEWS.marketing = async (_, forcar) => {
  S.diasMk = S.diasMk || 30;
  titulo('Marketing', '<div class="seg" data-seg-own id="dMk">' + [7, 30, 90].map((n) => '<button data-n="' + n + '" class="' + (S.diasMk === n ? 'on' : '') + '">' + n + ' dias</button>').join('') + '</div>');
  $$('#dMk button').forEach((b) => b.onclick = () => { S.diasMk = +b.dataset.n; VIEWS.marketing(); });
  if (!S.cache['mk' + S.diasMk]) carregando(4);
  const d = await dados('mk' + S.diasMk, 'marketing', { dias: S.diasMk }, forcar);
  const cs = d.canais || [], g = d.gasto || {};
  const tot = cs.reduce((t, c) => { ['leads', 'qualificados', 'consultas', 'contratos', 'honorarios'].forEach((k) => t[k] += Number(c[k] || 0)); return t; }, { leads: 0, qualificados: 0, consultas: 0, contratos: 0, honorarios: 0 });
  const gt = Number(g.GOOGLE_ADS || 0) + Number(g.META_ADS || 0);
  const por = (a, b) => b > 0 && a > 0 ? brl(a / b) : '—';
  let h = '<div class="kpis" style="margin-top:12px">' +
    ['Atendimentos|' + num(tot.leads) + '|' + num(tot.qualificados) + ' no perfil|pessoa', 'Investido|' + brlc(gt) + '|Google + Meta|mega', 'Custo por atendimento|' + por(gt, tot.leads) + '|média dos anúncios|grafico',
      'Custo por consulta paga|' + por(gt, tot.consultas) + '|' + num(tot.consultas) + ' consulta(s)|video', 'Contratos|' + num(tot.contratos) + '|' + brlc(tot.honorarios) + ' em honorários|caneta', 'Retorno|' + (gt > 0 ? (tot.honorarios / gt).toFixed(1).replace('.', ',') + 'x' : '—') + '|honorários ÷ investido|din']
      .map((s) => { const [r, v, sb, i] = s.split('|'); return '<div class="card kpi"><div class="ico">' + ic(i, 's') + '</div><div class="rot">' + r + '</div><div class="val">' + v + '</div><div class="sub">' + sb + '</div></div>'; }).join('') + '</div>';
  h += '<div class="sec-tit">Resultado por canal</div><div class="card tab-wrap"><table class="tb"><thead><tr><th>Canal</th><th>Atend.</th><th>No perfil</th><th>Consultas</th><th>Contratos</th><th>Investido</th><th>Custo/atend.</th><th>Custo/consulta</th><th>Honorários</th></tr></thead><tbody>' +
    (cs.length ? cs.map((c) => { const gc = Number(g[c.canal] || 0); return '<tr><td>' + esc(CANAL[c.canal] || (c.canal === 'SEM_REGISTRO' ? 'Sem registro' : c.canal)) + '</td><td>' + num(c.leads) + '</td><td>' + num(c.qualificados) + '</td><td>' + num(c.consultas) + '</td><td>' + num(c.contratos) + '</td><td>' + (gc ? brl(gc) : '—') + '</td><td>' + por(gc, c.leads) + '</td><td>' + por(gc, c.consultas) + '</td><td>' + (Number(c.honorarios) ? brl(c.honorarios) : '—') + '</td></tr>'; }).join('') : '<tr><td colspan="9" class="mut" style="text-align:center">Nenhum atendimento no período.</td></tr>') +
    '</tbody>' + (cs.length > 1 ? '<tfoot><tr><td>Total</td><td>' + num(tot.leads) + '</td><td>' + num(tot.qualificados) + '</td><td>' + num(tot.consultas) + '</td><td>' + num(tot.contratos) + '</td><td>' + (gt ? brl(gt) : '—') + '</td><td>' + por(gt, tot.leads) + '</td><td>' + por(gt, tot.consultas) + '</td><td>' + (tot.honorarios ? brl(tot.honorarios) : '—') + '</td></tr></tfoot>' : '') + '</table></div>' +
    '<p class="pp mut" style="margin:8px 2px 0">"No perfil" = devedor ou arrematante que passou da triagem. O custo por canal considera o investido nos anúncios de cada plataforma no período.</p>';
  const agente = (nome, i, sub, x, campo, link) => {
    const dias = x.dias || [], mx = Math.max(1, ...dias.map((z) => Number(z.custo)));
    return '<div class="card"><div class="cab"><div class="ic-circ info">' + ic(i, 's') + '</div><h2 style="flex:1">' + nome + '</h2><a class="btn sm fant" href="' + link + '" target="_blank" rel="noopener">' + ic('link', 's') + ' Painel</a></div><div class="corpo">' +
      '<div class="pq mut">' + esc(String(x.linha || 'Ainda sem relatório.').replace(/: https?:\S+/, '')) + '</div>' +
      (dias.length ? '<div class="barras" style="height:110px;margin-top:10px">' + dias.map((z, j) => '<div class="b" title="' + z.dia + ': ' + brl(z.custo) + ' · ' + num(z.cliques) + ' cliques · ' + num(z[campo]) + ' ' + sub + '"><i style="height:' + (100 * z.custo / mx) + '%"></i><span>' + (j % 2 ? '' : z.dia.slice(0, 2)) + '</span></div>').join('') + '</div><div class="legenda"><span><i style="background:var(--gold)"></i>Investimento diário · 15 dias</span></div>' : '<div class="vazio" style="padding:16px">Sem investimento registrado ainda. As campanhas estão pausadas.</div>') +
      ((x.acoes || []).length ? '<div class="pq" style="font-weight:650;margin-top:12px">O que foi feito</div><ul class="lim pq">' + x.acoes.slice(0, 6).map((a) => '<li>' + esc(a.descricao) + ' <span class="mut pp">' + esc(quando(a.created_at, true)) + '</span></li>').join('') + '</ul>' : '') + '</div></div>';
  };
  const cr = (d.meta || {}).criativos || {};
  h += '<div class="grid g2" style="margin-top:16px">' + agente('Gabriel · Google Ads', 'google', 'conversões', d.google || {}, 'conversoes', LINKS.gabriel) + agente('Marina · Meta Ads', 'meta', 'conversas', d.meta || {}, 'conversas', LINKS.marina) + '</div>';
  if (Object.keys(cr).length) h += '<div class="chips" style="margin-top:10px">' + Object.entries(cr).map(([k, v]) => '<span class="chip">' + esc({ AGUARDANDO: 'aguardando você', APROVADO: 'aprovados', PRONTO: 'prontos (pausados)', NO_AR: 'no ar', PAUSADO: 'pausados', REPROVADO_META: 'reprovados pela Meta', FALHOU: 'com falha' }[k] || k.toLowerCase()) + ': ' + v + '</span>').join('') + ' <span class="pp mut" style="align-self:center">anúncios da Marina</span></div>';
  const bz = d.beatriz || [];
  h += '<div class="sec-tit">Beatriz · LinkedIn</div><div class="card lista">' + (bz.length ? bz.map((b) => '<div class="item"><div class="ic-circ ouro">' + ic('linkedin', 's') + '</div><div class="mid"><div class="t">' + esc(b.tema || 'Post') + '</div><div class="d">' + esc(b.data_publicacao ? dataCurta(b.data_publicacao + 'T12:00:00') : '') + '</div></div><div class="dir" style="flex-direction:row;gap:6px"><span class="chip ' + (b.status === 'PUBLICADO' ? 'ok' : b.status === 'AGUARDANDO' ? 'warn' : '') + '">' + esc(String(b.status).toLowerCase()) + '</span>' + (b.linkedin_url ? '<a class="btn sm fant" href="' + esc(b.linkedin_url) + '" target="_blank" rel="noopener">Ver</a>' : '') + '</div></div>').join('') : '<div class="vazio">Nenhum post ainda.</div>') + '</div>';
  $('#cont').innerHTML = h;
};
// ---------- DESPESAS ----------
const CAT_DESP = { FERRAMENTAS: 'Ferramentas e sistemas', MARKETING: 'Marketing e anúncios', IMPOSTOS: 'Impostos e taxas', PROFISSIONAIS: 'Profissionais', TELEFONIA: 'Telefonia e WhatsApp', SITE: 'Site e domínio', FINANCEIRO: 'Tarifas financeiras', ESCRITORIO: 'Escritório', OUTROS: 'Outros' };
const PER_DESP = { MENSAL: ['por mês', 1], TRIMESTRAL: ['por trimestre', 3], SEMESTRAL: ['por semestre', 6], ANUAL: ['por ano', 12], UNICA: ['pagamento único', 0], VARIAVEL: ['variável', 0] };
const mensalDe = (d) => { const p = PER_DESP[d.periodicidade] || PER_DESP.MENSAL; return d.valor == null || !p[1] ? null : Number(d.valor) / p[1]; };
VIEWS.despesas = async (_, forcar) => {
  titulo('Despesas', '<button class="btn sm pri" id="bNovaDesp">' + ic('mais2', 's') + '<span class="so-desk"> Nova despesa</span></button>');
  if (!S.cache.desp) carregando(4);
  const d = await dados('desp', 'despesas', null, forcar);
  const itens = d.itens || [], ads = d.ads_mes || {};
  const fixo = itens.reduce((s, x) => s + (mensalDe(x) || 0), 0);
  const semValor = itens.filter((x) => x.valor == null && x.periodicidade !== 'VARIAVEL');
  const variaveis = itens.filter((x) => x.periodicidade === 'VARIAVEL');
  const adsReal = Number(ads.google || 0) + Number(ads.meta || 0);
  const verbaAds = itens.filter((x) => x.categoria === 'MARKETING' && /ads/i.test(x.nome)).reduce((s, x) => s + (mensalDe(x) || 0), 0);
  const fixoSemAds = fixo - verbaAds;
  const totalMes = fixoSemAds + adsReal;
  const receb = Number(d.recebido_mes || 0);
  const kpi = (rot, val, sub, i) => '<div class="card kpi"><div class="ico">' + ic(i, 's') + '</div><div class="rot">' + rot + '</div><div class="val">' + val + '</div><div class="sub">' + sub + '</div></div>';
  let h = '<div class="kpis" style="margin-top:12px">' +
    kpi('Custos fixos', brlc(fixoSemAds), 'por mês, sem anúncios', 'recibo') +
    kpi('Anúncios no mês', brlc(adsReal), 'gasto real · verba ' + brlc(verbaAds), 'mega') +
    kpi('Total do mês', brlc(totalMes), 'fixos + anúncios', 'din') +
    kpi('Recebido no mês', brlc(receb), 'líquido das taxas', 'check') +
    kpi('Resultado', '<span style="color:var(--' + (receb - totalMes >= 0 ? 'ok' : 'bad') + ')">' + brlc(receb - totalMes) + '</span>', 'recebido − despesas', 'grafico') +
    kpi('Sem valor', num(semValor.length), semValor.length ? 'toque para preencher' : 'tudo preenchido', 'alerta') + '</div>';
  if (semValor.length) h += '<div class="card" style="margin-top:14px;border-color:var(--warn)"><div class="corpo pq">' + ic('alerta', 's') + ' Falta o valor de: ' + semValor.map((x) => '<a href="#" data-ed="' + x.id + '" style="color:var(--gold);font-weight:600">' + esc(x.nome) + '</a>').join(', ') + '. Assim o total do mês fica completo.</div></div>';
  const grupos = {};
  itens.forEach((x) => { (grupos[x.categoria] = grupos[x.categoria] || []).push(x); });
  Object.keys(CAT_DESP).filter((k) => grupos[k]).forEach((k) => {
    const g = grupos[k], sub = g.reduce((s, x) => s + (mensalDe(x) || 0), 0);
    h += '<div class="sec-tit">' + esc(CAT_DESP[k]) + '<span class="mut pp" style="margin-left:auto;text-transform:none;letter-spacing:0">' + (sub ? brl(sub) + '/mês' : '') + '</span></div><div class="card lista">';
    g.forEach((x) => {
      const p = PER_DESP[x.periodicidade] || PER_DESP.MENSAL, m = mensalDe(x);
      const val = x.valor == null ? '<span class="chip warn">sem valor</span>' : '<b>' + brl(x.valor) + '</b> <span class="mut pp">' + p[0] + '</span>';
      h += '<div class="item clic" data-ed="' + x.id + '"><div class="mid"><div class="t">' + esc(x.nome) + '</div><div class="d">' + [x.obs ? esc(x.obs) : '', x.vencimento_dia ? 'vence dia ' + x.vencimento_dia : '', x.periodicidade === 'VARIAVEL' ? 'valor variável' : ''].filter(Boolean).join(' · ') + '</div></div><div class="dir">' + (x.periodicidade === 'VARIAVEL' && x.valor == null ? '<span class="chip">variável</span>' : val) + (m != null && p[1] > 1 ? '<span class="pp mut">≈ ' + brl(m) + '/mês</span>' : '') + '</div></div>';
    });
    h += '</div>';
  });
  if (variaveis.length) h += '<p class="pp mut" style="margin:10px 2px 0">Despesas variáveis (como o Simples Nacional e as taxas do Asaas) não entram nos custos fixos. Se quiser, cadastre um valor médio nelas.</p>';
  $('#cont').innerHTML = h;
  const abrir = (x) => editarDespesa(x || {});
  $$('[data-ed]').forEach((el) => el.onclick = (e) => { e.preventDefault(); abrir(itens.find((i) => i.id === el.dataset.ed)); });
  $('#bNovaDesp').onclick = () => abrir({});
};
async function editarDespesa(x) {
  const opt = (obj, sel) => Object.entries(obj).map(([k, v]) => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + (Array.isArray(v) ? v[0].replace(/^por /, '').replace(/^\w/, (c) => c.toUpperCase()) : v) + '</option>').join('');
  const r = await modal({ titulo: x.id ? 'Editar despesa' : 'Nova despesa', corpo:
    '<label class="pq mut">Nome</label><input class="inp" id="dn" style="margin:6px 0 12px" value="' + esc(x.nome || '') + '" placeholder="Ex.: Contador">' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="pq mut">Valor (R$)</label><input class="inp" id="dv" inputmode="decimal" style="margin-top:6px" value="' + (x.valor != null ? String(x.valor).replace('.', ',') : '') + '" placeholder="0,00"></div>' +
    '<div><label class="pq mut">Frequência</label><select class="sel" id="dp" style="margin-top:6px">' + opt(PER_DESP, x.periodicidade || 'MENSAL') + '</select></div></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div><label class="pq mut">Categoria</label><select class="sel" id="dc" style="margin-top:6px">' + opt(CAT_DESP, x.categoria || 'FERRAMENTAS') + '</select></div>' +
    '<div><label class="pq mut">Dia do vencimento</label><input class="inp" id="dd" inputmode="numeric" style="margin-top:6px" value="' + (x.vencimento_dia || '') + '" placeholder="opcional"></div></div>' +
    '<label class="pq mut" style="display:block;margin-top:12px">Observação</label><input class="inp" id="do" style="margin-top:6px" value="' + esc(x.obs || '') + '" placeholder="opcional">',
    botoes: (x.id ? [{ t: 'Excluir', c: 'fant', v: 'excluir' }] : []).concat([{ t: 'Cancelar', c: 'fant', v: null }, { t: 'Salvar', c: 'pri', v: (m) => {
      const nome = $('#dn', m).value.trim(); if (nome.length < 2) { $('#dn', m).focus(); return false; }
      return { id: x.id || '', nome, valor: $('#dv', m).value.trim(), periodicidade: $('#dp', m).value, categoria: $('#dc', m).value, vencimento_dia: $('#dd', m).value.trim(), obs: $('#do', m).value.trim() };
    } }]) });
  if (!r) return;
  try {
    if (r === 'excluir') { if (!(await confirmar('Excluir despesa?', 'A despesa "' + x.nome + '" sai da lista.', 'Excluir', true))) return; await api('despesa_excluir', { id: x.id }); toast('Despesa excluída'); }
    else { await api('despesa_salvar', r); toast('Despesa salva'); }
  } catch (e) { toast(e.message, true); return; }
  delete S.cache.desp; VIEWS.despesas(null, true);
}
