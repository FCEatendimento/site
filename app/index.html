<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCE · Gestão</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FCE">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>:root{
  --navy:#0E1A2B;--navy-2:#16263d;--gold:#C9901C;--gold-2:#e0a93a;--gold-soft:rgba(201,144,28,.12);
  --bg:#F4F2ED;--surface:#FFFFFF;--surface-2:#F9F8F5;--line:rgba(14,26,43,.09);--line-2:rgba(14,26,43,.16);
  --txt:#142033;--mut:#667085;--mut-2:#98A2B3;
  --ok:#12805c;--ok-soft:rgba(18,128,92,.12);--warn:#b54708;--warn-soft:rgba(181,71,8,.12);--bad:#c0261a;--bad-soft:rgba(192,38,26,.11);--info:#2e6ad1;--info-soft:rgba(46,106,209,.11);
  --r:14px;--r-sm:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sh-lg:0 12px 32px rgba(16,24,40,.14);
  --side:248px;--top:60px;--tab:68px;
  --serif:"Playfair Display",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --bg:#0A111D;--surface:#111B2B;--surface-2:#0E1726;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --txt:#E8EBF0;--mut:#98A2B3;--mut-2:#6b7688;--gold-soft:rgba(224,169,58,.14);
  --ok-soft:rgba(18,160,112,.16);--warn-soft:rgba(230,120,40,.16);--bad-soft:rgba(230,70,60,.16);--info-soft:rgba(80,140,240,.16);
  --sh:0 1px 2px rgba(0,0,0,.4);--sh-lg:0 12px 32px rgba(0,0,0,.5)}}
:root[data-tema="escuro"]{--bg:#0A111D;--surface:#111B2B;--surface-2:#0E1726;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --txt:#E8EBF0;--mut:#98A2B3;--mut-2:#6b7688;--gold-soft:rgba(224,169,58,.14);--ok-soft:rgba(18,160,112,.16);--warn-soft:rgba(230,120,40,.16);--bad-soft:rgba(230,70,60,.16);--info-soft:rgba(80,140,240,.16);--sh:0 1px 2px rgba(0,0,0,.4);--sh-lg:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
/* layout */
.app{min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#DDE3EC;display:flex;flex-direction:column;padding:18px 14px;z-index:30}
.marca{display:flex;align-items:center;gap:12px;padding:6px 8px 22px}
.marca .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#1c2e49,#0b1524);border:1px solid rgba(201,144,28,.45);display:grid;place-items:center;font:700 22px var(--serif);color:var(--gold)}
.marca b{display:block;font:700 17px/1.1 var(--serif);color:#fff;letter-spacing:.2px}
.marca span{font-size:12px;color:#8C98AB;letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#B7C1D0;font-weight:500;position:relative}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(201,144,28,.14);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .bdg{margin-left:auto}
.side .rodape{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.08)}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.side .rodape .n{font-size:13px;color:#fff;font-weight:600;line-height:1.2}
.side .rodape .e{font-size:11.5px;color:#8C98AB;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.side .rodape button{margin-left:auto;background:none;border:0;color:#8C98AB;cursor:pointer;padding:6px;border-radius:8px}
.side .rodape button:hover{color:#fff;background:rgba(255,255,255,.06)}
.main{margin-left:var(--side);min-height:100vh}
.topo{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent}
.topo.sombra{border-bottom-color:var(--line)}
.topo h1{font:700 21px var(--serif);margin:0;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .acoes{margin-left:auto;display:flex;gap:8px;align-items:center}
.conteudo{padding:8px 28px 48px;max-width:1240px}
.tabbar{display:none}
@media (max-width:900px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
  .topo{padding:0 16px;padding-top:env(safe-area-inset-top);height:calc(var(--top) + env(safe-area-inset-top))}
  .topo h1{font-size:19px}
  .conteudo{padding:6px 16px 32px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab) + env(safe-area-inset-bottom));padding:6px 6px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mut);position:relative;border-radius:12px}
  .tabbar a.on{color:var(--gold)}
  .tabbar a .bdg{position:absolute;top:2px;left:calc(50% + 6px)}
  .tabbar svg.i{width:23px;height:23px}
}
/* elementos */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media (min-width:1260px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.card>.cab{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.card>.cab h2{font-size:14.5px;font-weight:650;margin:0;letter-spacing:.1px}
.card>.cab .dir{margin-left:auto;display:flex;gap:6px;align-items:center}
.card>.corpo{padding:12px 16px 16px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .rot{font-size:12.5px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font:700 25px/1.1 var(--sans);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--mut)}
.kpi .ico{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
@media (max-width:760px){.kpi .val{font-size:21px}.kpi{padding:12px 13px}.kpi .ico{display:none}}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--mut);border:1px solid var(--line)}
.chip.ouro{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.nav{background:var(--navy);color:#fff;border-color:transparent}
.bdg{min-width:19px;height:19px;padding:0 6px;border-radius:99px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.bdg.r{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--mut-2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.pri:hover{background:var(--gold-2)}
.btn.esc{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.fant{border-color:transparent;background:transparent;color:var(--mut)}
.btn.fant:hover{background:var(--surface-2);color:var(--txt)}
.btn.perigo{color:var(--bad)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.ico{width:38px;padding:0}
.btn[disabled]{opacity:.55;pointer-events:none}
.mut{color:var(--mut)}.pq{font-size:13px}.pp{font-size:12px}
.lista{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);cursor:default}
.item:first-child{border-top:0}
a.item,.item.clic{cursor:pointer}
a.item:hover,.item.clic:hover{background:var(--surface-2)}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px;line-height:1.35}
.item .d{font-size:13px;color:var(--mut);line-height:1.4;margin-top:2px}
.item .dir{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:var(--mut-2)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.ouro{background:var(--gold)}.dot.info{background:var(--info)}
.ic-circ{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--mut)}
.ic-circ.bad{background:var(--bad-soft);color:var(--bad)}.ic-circ.warn{background:var(--warn-soft);color:var(--warn)}.ic-circ.ok{background:var(--ok-soft);color:var(--ok)}.ic-circ.ouro{background:var(--gold-soft);color:var(--gold)}.ic-circ.info{background:var(--info-soft);color:var(--info)}
.vazio{padding:28px 16px;text-align:center;color:var(--mut);font-size:14px}
.vazio svg.i{width:30px;height:30px;color:var(--mut-2);margin-bottom:6px}
.sec-tit{font:700 13px var(--sans);text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:26px 2px 10px;display:flex;align-items:center;gap:8px}
.ola{margin:14px 0 18px}
.ola h2{font:700 26px var(--serif);margin:0;letter-spacing:.1px}
.ola p{margin:4px 0 0;color:var(--mut)}
@media (max-width:760px){.ola h2{font-size:22px}}
/* busca e filtros */
.busca{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line-2);flex:1;min-width:0}
.busca input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:12px 0}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:none;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.filtros button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filtros button .n{opacity:.7;margin-left:4px;font-weight:500}
select.sel,input.inp,textarea.inp{height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;outline:0;width:100%}
textarea.inp{height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.45}
select.sel:focus,input.inp:focus,textarea.inp:focus,.busca:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
/* caso */
.cab-caso{padding:18px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cab-caso .av{width:56px;height:56px;font-size:19px}
.cab-caso h2{font:700 23px/1.2 var(--serif);margin:0}
.cab-caso .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cab-caso .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
@media (max-width:760px){.cab-caso .acoes{margin-left:0;width:100%}.cab-caso .acoes .btn{flex:1}}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin:16px 0 14px;position:sticky;top:var(--top);background:var(--bg);z-index:10}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;border:0;background:none;padding:11px 12px;font-weight:600;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.abas button.on{color:var(--txt);border-bottom-color:var(--gold)}
@media (max-width:900px){.abas{top:calc(var(--top) + env(safe-area-inset-top))}}
.def{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 16px;font-size:14px}
.def dt{color:var(--mut)}.def dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.def{grid-template-columns:1fr}.def dt{margin-top:6px}}
.texto{white-space:pre-wrap;font-size:14.5px;line-height:1.6}
.gauge{display:flex;align-items:center;gap:12px}
.gauge .barra{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.gauge .barra i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.gauge b{font:700 22px var(--sans)}
ul.lim{margin:6px 0 0;padding-left:18px}ul.lim li{margin:3px 0}
/* conversa */
.chat{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line);max-height:70vh;overflow:auto}
.bolha{max-width:78%;padding:8px 12px 6px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--sh)}
.bolha.in{align-self:flex-start;background:var(--surface);border-top-left-radius:4px}
.bolha.out{align-self:flex-end;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border-top-right-radius:4px}
.bolha .h{display:block;text-align:right;font-size:11px;color:var(--mut);margin-top:2px}
.bolha .doc{display:flex;gap:6px;align-items:center;font-weight:600}
.dia-sep{align-self:center;font-size:11.5px;font-weight:600;color:var(--mut);background:var(--surface);border:1px solid var(--line);padding:2px 10px;border-radius:99px;margin:8px 0}
/* aprovações */
.prev{border-radius:12px;overflow:hidden;background:#0E1A2B;position:relative}
.prev iframe{border:0;transform-origin:0 0;display:block;pointer-events:none;position:absolute;top:0;left:0}
.ad-post{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:16px;padding:16px}
@media (max-width:760px){.ad-post{grid-template-columns:1fr}}
.ad-post .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:var(--sh)}
/* agenda */
.dia-ag{margin-top:18px}
.dia-ag h3{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.dia-ag h3 .hoje{color:var(--gold)}
.hora{font:600 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--mut);width:48px;flex:none;padding-top:1px}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mes .cab{font-size:11.5px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0;text-transform:uppercase}
.mes .dia{min-height:78px;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:6px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mes .dia.fora{opacity:.4}
.mes .dia.hoje{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.mes .dia .n{font-weight:700;font-size:12.5px}
.mes .dia .ev{font-size:10.5px;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
@media (max-width:760px){.mes .dia{min-height:54px}.mes .dia .ev{display:none}.mes .dia .pts{display:flex;gap:3px}}
.mes .dia .pts{display:none}
.mes .dia .pts i{width:6px;height:6px;border-radius:50%}
.t-consulta{background:var(--info-soft);color:var(--info)}.t-prazo{background:var(--bad-soft);color:var(--bad)}.t-leilao{background:var(--warn-soft);color:var(--warn)}.t-post{background:var(--gold-soft);color:var(--gold)}.t-insta{background:var(--gold-soft);color:var(--gold)}
/* tabelas e gráficos */
.tab-wrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.tb th{text-align:right;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb tr:last-child td{border-bottom:0}
table.tb tfoot td{font-weight:700;border-top:1px solid var(--line-2)}
.barras{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.barras .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.barras .b i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:var(--gold);min-height:2px}
.barras .b i.s{background:var(--navy)}
:root[data-tema="escuro"] .barras .b i.s{background:#5b6f8f}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]) .barras .b i.s{background:#5b6f8f}}
.barras .b span{font-size:10.5px;color:var(--mut);white-space:nowrap}
.barras .par{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:100%}
.barras .par i{max-width:18px}
.funil .l{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
.funil .l .nm{width:150px;flex:none;color:var(--mut)}
.funil .l .br{flex:1;height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.funil .l .br i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),#2a4165);border-radius:6px}
.funil .l b{width:30px;text-align:right;font-variant-numeric:tabular-nums}

  const iniciar = () => {
    if (!window.google || !google.accounts || !google.accounts.id) return setTimeout(iniciar, 200);
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: aoLogar, auto_select: true, ux_mode: 'popup', hd: 'fceadvogados.com.br' });
    $('#gbtn').innerHTML = '';
    google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'pt-BR', width: 280 });
    google.accounts.id.prompt();

async function aoLogar(resp) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao: 'login', credential: resp.credential }) });
    const j = await r.json().catch(() => null);
    if (!j || !j.ok) return telaLogin((j && j.erro) || 'Não foi possível entrar.');
    S.token = j.dados.token; S.eu = { nome: j.dados.nome, email: j.dados.email, foto: j.dados.foto };
    try { localStorage.setItem('fce_token', S.token); localStorage.setItem('fce_eu', JSON.stringify(S.eu)); } catch (e) {}
    montar(); rota().then(() => { carregarLinks(); setTimeout(preCarregar, 800); });
  } catch (e) { telaLogin('Sem conexão. Tente de novo.'); }
}
function sair(expirou) {
  const t = S.token; S.token = null; S.eu = null; S.cache = {}; limparLS();
  try { localStorage.removeItem('fce_token'); localStorage.removeItem('fce_eu'); localStorage.removeItem('fce_links'); } catch (e) {}
  LINKS.proposta = LINKS.proposta.split('?')[0]; LINKS.gabriel = LINKS.gabriel.split('?')[0]; LINKS.marina = LINKS.marina.split('?')[0]; LINKS.painel = LINKS.painel.split('?')[0];
  if (t && !expirou) fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-fce-token': t }, body: JSON.stringify({ acao: 'sair', token: t }) }).catch(() => {});
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  telaLogin(expirou ? 'Sua sessão expirou. Entre de novo.' : '');
}

// Cache em duas camadas: memória (45 s) e aparelho (localStorage). Ao abrir, mostra o último dado na hora
// e busca o novo em segundo plano; se mudou, a tela se redesenha sozinha.
const LSK = 'fce_c_';
function lerLS(k) { try { const v = localStorage.getItem(LSK + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function gravar(k, d) { S.cache[k] = { d, t: Date.now() }; try { localStorage.setItem(LSK + k, JSON.stringify({ d, t: Date.now() })); } catch (e) { limparLS(); } }
function limparLS() { try { Object.keys(localStorage).filter((k) => k.startsWith(LSK)).forEach((k) => localStorage.removeItem(k)); } catch (e) {} }
S.rev = {};
function revalidar(k, acao, extra) {
  if (S.rev[k]) return; S.rev[k] = 1;
  const hash = location.hash, antes = JSON.stringify((S.cache[k] || {}).d);
  api(acao, extra).then((d) => {
    gravar(k, d);
    if (JSON.stringify(d) !== antes && location.hash === hash && !$('.veu') && !(document.activeElement && /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName))) rota();
  }).catch(() => {}).finally(() => { delete S.rev[k]; });
}
async function dados(chave, acao, extra, forcar) {
  const mem = S.cache[chave];
  if (!forcar && mem && Date.now() - mem.t < 45000) return mem.d;
  if (!forcar) {
    const velho = mem || lerLS(chave);
    if (velho) { if (!mem) S.cache[chave] = { d: velho.d, t: 0 }; revalidar(chave, acao, extra); return velho.d; }
  }
  const d = await api(acao, extra); gravar(chave, d); return d;
}

function ligarQuadro(recarregar) {
  if (!matchMedia('(hover: hover)').matches) return;
  let arrastando = null;
  $$('.kcard').forEach((k) => {
    k.ondragstart = (ev) => { arrastando = k; k.classList.add('arrastando'); ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', k.dataset.id); } catch (e) {} };
    k.ondragend = () => { k.classList.remove('arrastando'); $$('.kcol').forEach((c) => c.classList.remove('alvo')); };
  });
  $$('.kcol').forEach((col) => {
    col.ondragover = (ev) => { if (!arrastando) return; ev.preventDefault(); col.classList.add('alvo'); };
    col.ondragleave = (ev) => { if (!col.contains(ev.relatedTarget)) col.classList.remove('alvo'); };
    col.ondrop = async (ev) => {
      ev.preventDefault(); col.classList.remove('alvo');
      const k = arrastando; arrastando = null; if (!k) return;
      const de = k.closest('.kcol').dataset.etapa, para = col.dataset.etapa; if (de === para) return;
      const ok = await confirmar('Mudar fase', 'Mover ' + k.dataset.nome + ' de "' + ETAPA[de] + '" para "' + ETAPA[para] + '"? A mudança fica no histórico e aciona o agente da nova fase.', 'Mover');
      if (!ok) return;
      let motivo = 'Movido no quadro do app';
      if (ETAPAS_PERDA.includes(para)) { const mp = await pedirMotivoPerda(k.dataset.nome); if (!mp) return; motivo = mp; }
      try { await agir(null, () => api('etapa', { id: k.dataset.id, etapa: para, motivo }), 'Caso movido para ' + ETAPA[para]); } catch (e) { return; }
      S.cache = {}; recarregar();
    };
  });

    const fim = new Date(ini.getTime() + 4 * 864e5);
    h += '<div class="card cal-sem"><div class="cab"><h2 style="flex:1">' + (w === 0 ? 'Esta semana' : w === 1 ? 'Próxima semana' : 'Semana de ' + esc(ini.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', timeZone: 'UTC' }))) + '</h2><span class="pp mut">' + esc(ini.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'UTC' })) + ' a ' + esc(fim.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'UTC' })) + '</span></div>' +
      '<div class="cal-cols"><span></span><span>' + rede('linkedin') + ' LinkedIn</span><span>' + rede('insta') + rede('facebook') + ' Instagram e Facebook</span></div>';
    for (let i = 0; i < 5; i++) {
      const x = new Date(ini.getTime() + i * 864e5), k = x.toISOString().slice(0, 10);
      h += '<div class="cal-dia' + (k === hoje ? ' hoje' : '') + '" style="' + (k < hoje ? 'opacity:.62' : '') + '"><div class="dn">' + esc(x.toLocaleDateString('pt-BR', { weekday: 'short', timeZone: 'UTC' }).replace('.', '')) + '<small>' + esc(x.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'UTC' })) + '</small></div>' +
        slot(mL[k], 'linkedin', k, i + 1) + slot(mI[k], 'insta', k, i + 1) + '</div>';
    }
    h += '</div>';
  }
  h += '<div class="sec-tit">Pautas da semana <span class="pp mut" style="font-weight:500;margin-left:6px">notícias que a Beatriz e a Marina podem usar como gancho</span></div><div class="card lista">' + (nt.length ? nt.map(itemPauta).join('') : '<div class="vazio">As notícias do tema aparecem aqui todo dia às 6h.</div>') + '</div>';
  $('#cont').innerHTML = h;
  const recarregar = () => { S.cache = {}; VIEWS.conteudo(null, true); };
  $$('[data-post]').forEach((b) => b.onclick = async () => {
    const [canal, tk] = b.dataset.post.split('|');
    const p = (canal === 'insta' ? ig : li).find((x) => x.token === tk); if (!p) return;
    const pend = ['AGUARDANDO', 'FALHOU'].includes(p.status);
    const corpo = '<div class="post-modal">' + (p.html ? prevHtml(p.html, 'm0') : '') + '<div class="chips" style="margin:12px 0 6px"><span class="chip">' + rede(canal) + (canal === 'insta' ? rede('facebook') + 'Marina' : 'Beatriz') + '</span><span class="chip">' + esc(dataCurta(p.data_publicacao + 'T12:00:00')) + (canal === 'insta' ? ' às 12h' : ' às 8h') + '</span><span class="st ' + esc(p.status) + '">' + esc(STATUS_POST[p.status] || p.status) + '</span></div>' +
      '<div style="font-weight:700">' + esc(p.tema || '') + '</div>' + (p.erro ? '<p class="pp" style="color:var(--bad)">' + esc(p.erro) + '</p>' : '') +
      '<div class="texto pq" style="margin-top:8px;padding:12px;border-radius:10px;background:var(--surface-2);max-height:220px;overflow:auto;white-space:pre-wrap">' + esc(p.texto || '') + '</div>' +
      (p.link ? '<p class="pq" style="margin-top:10px"><a href="' + esc(p.link) + '" target="_blank" rel="noopener">' + ic('link', 's') + ' Ver publicação</a></p>' : '') + '</div>';
    const botoes = pend ? [{ t: 'Descartar', c: 'fant', v: 'descartar' }, { t: 'Pedir ajuste', c: 'fant', v: 'ajustar' }, { t: 'Editar texto', c: '', v: 'editar' }, { t: 'Aprovar', c: 'pri', v: 'aprovar' }] : [{ t: 'Fechar', c: 'pri', v: null }];
    const pr = modal({ titulo: canal === 'insta' ? 'Post do Instagram' : 'Post do LinkedIn', corpo, botoes });
    setTimeout(ajustarPrevs, 50);
    let a = await pr; if (!a) return;
    let obs = '', texto = '';
    if (a === 'editar') { texto = await pedirTexto(canal === 'insta' ? 'Editar legenda' : 'Editar texto do post', 'O post é aprovado com o texto que você deixar aqui.', '', true, p.texto); if (!texto) return; a = 'aprovar'; }
    if (a === 'ajustar') { obs = await pedirTexto('Pedir ajuste', 'O que mudar no post?', '', true); if (!obs) return; }
    if (a === 'descartar' && !(await confirmar('Descartar post?', 'Este post não será publicado.', 'Descartar', true))) return;
    try {
      await agir(null, () => api('decidir', { tipo: canal === 'insta' ? 'insta' : 'post', token: tk, decisao: a, obs, texto }), a === 'aprovar' ? 'Post aprovado' : a === 'descartar' ? 'Post descartado' : 'Pedido enviado. A nova versão chega em alguns minutos.');
    } catch (e) { return; }
    recarregar();
  });
};
// ---------- mensagens de clientes para você (conversas que estão com o Dr. Fábio) ----------
const MSGV = 'fce_msg_vistas';
function vistas() { try { return JSON.parse(localStorage.getItem(MSGV) || '{}'); } catch (e) { return {}; } }
function marcarVista(casoId, t) { const v = vistas(); if (!v[casoId] || new Date(t) > new Date(v[casoId])) v[casoId] = t; try { localStorage.setItem(MSGV, JSON.stringify(v)); } catch (e) {} }
function badgeMsgs() { const n = (S.msgs || []).length; $$('[data-bdg-msg]').forEach((b) => { b.hidden = !n; b.textContent = n > 99 ? '99+' : n; }); }
S.msgs = []; S.avisadas = {};
function notifSuportada() { return 'Notification' in window && 'serviceWorker' in navigator; }
async function avisoSistema(m) {
  if (!notifSuportada() || Notification.permission !== 'granted') return;
  try { const r = await navigator.serviceWorker.ready; await r.showNotification('Mensagem de ' + (m.nome || 'cliente'), { body: String(m.texto || '').slice(0, 180), tag: 'caso-' + m.caso_id, icon: 'icon-192.png', badge: 'icon-192.png', data: { url: './#/caso/' + m.caso_id + '?aba=conversa' } }); } catch (e) {}
}
function toastMsg(m) {
  $$('.toast').forEach((t) => t.remove());
  const t = document.createElement('a'); t.className = 'toast msg'; t.href = '#/caso/' + m.caso_id + '?aba=conversa';
  t.innerHTML = ic('chat', 's') + '<span><b>' + esc(m.nome || 'Cliente') + '</b> escreveu: ' + esc(String(m.texto || '').slice(0, 90)) + '</span>';
  t.onclick = () => t.remove();
  document.body.appendChild(t); setTimeout(() => t.remove(), 9000);
}
async function checarMensagens() {
  if (!S.token || !$('.app')) return;
  let l; try { l = await api('notificacoes'); } catch (e) { return; }
  const v = vistas();
  const aqui = (location.hash.match(/#\/caso\/([0-9a-f-]{36})/) || [])[1];
  (l || []).forEach((x) => { if (aqui === x.caso_id && S.abaCaso === 'conversa') marcarVista(x.caso_id, x.t); });
  const v2 = vistas();
  const novas = (l || []).filter((x) => !v2[x.caso_id] || new Date(x.t) > new Date(v2[x.caso_id]));
  S.msgs = novas; badgeMsgs();
  const inedita = novas.filter((x) => S.avisadas[x.caso_id] !== x.t);
  inedita.forEach((x) => { S.avisadas[x.caso_id] = x.t; });
  if (inedita.length) {
    if (document.visibilityState === 'visible') toastMsg(inedita[0]); else inedita.forEach(avisoSistema);
    if (aqui && inedita.some((x) => x.caso_id === aqui)) { S.cache = {}; VIEWS.caso(aqui, true); }
    else if (document.visibilityState === 'visible' && /^(#\/?(inicio)?)?$/.test(location.hash) && !$('.veu')) { rota(); }
  }
}
function cartaoMsgs() {
  const m = S.msgs || [];
  const pedir = notifSuportada() && Notification.permission === 'default';
  if (!m.length && !pedir) return '';
  let h = '<div class="card msgs-card" style="margin-top:16px"><div class="cab"><h2>' + ic('chat', 's') + ' Mensagens para você</h2><div class="dir">' + (m.length ? '<span class="bdg r">' + m.length + '</span>' : '') + '</div></div><div class="lista" style="margin-top:6px">';
  m.forEach((x) => { h += '<a class="item" href="#/caso/' + x.caso_id + '?aba=conversa"><div class="ic-circ warn">' + ic('chat', 's') + '</div><div class="mid"><div class="t">' + esc(x.nome || 'Cliente') + '</div><div class="d">' + esc(String(x.texto || '').slice(0, 120)) + ' · ' + esc(quando(x.t)) + '</div></div>' + ic('seta', 's') + '</a>'; });
  if (!m.length) h += '<div class="vazio" style="padding:10px">Nenhuma mensagem nova de clientes nas conversas que estão com você.</div>';
  h += '</div>' + (pedir ? '<div style="padding:4px 16px 14px"><button class="btn sm" id="bNotif">' + ic('sino', 's') + ' Ativar notificações neste aparelho</button></div>' : '') + '</div>';
  return h;
}
function ligarCartaoMsgs() {
  const b = $('#bNotif');
  if (b) b.onclick = async () => {
    try { const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Notificações ativadas neste aparelho' : 'Notificações não permitidas. Dá para mudar nos ajustes do navegador.', r !== 'granted'); } catch (e) { toast('Este navegador não aceita notificações.', true); }
    rota();
  };
}
setInterval(checarMensagens, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(checarMensagens, 1500); });
setTimeout(checarMensagens, 2500);
// ---------- início ----------
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
(function boot() {
  try { const t = localStorage.getItem('fce_tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
  const g = document.createElement('script'); g.src = 'https://accounts.google.com/gsi/client'; g.async = true; g.defer = true;

  document.head.appendChild(g);
  if (S.token) { montar(); rota().then(() => { carregarLinks(); setTimeout(preCarregar, 800); }); } else telaLogin();
})();
</script>
